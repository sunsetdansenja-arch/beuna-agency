<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Beuna Digital — Portfolio</title>
<style>
  :root {
    --bg: #eee;
    --text: #111;
    --burgundy: #7b1e2b;
    --dock-bottom: clamp(32px, 6vh, 56px);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button { font: inherit; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 4px rgba(123,30,43,.7); }

  /* ---------- Background (full bleed, tanpa bezel) ---------- */
  .portfolio {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .image-frame { position: absolute; inset: 0; overflow: hidden; }

  .portfolio-image,
  .blur-layer { position: absolute; inset: 0; width: 100%; height: 100%; }

  .portfolio-image {
    z-index: 0;
    background: url("https://res.cloudinary.com/naqr1mob/image/upload/v1791184969/front.jpg") center / cover no-repeat;
  }

  .blur-layer {
    z-index: 1;
    background:
      linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)),
      url("https://res.cloudinary.com/naqr1mob/image/upload/v1791184970/back.jpg") center / cover no-repeat;
    --reveal-x: 50%;
    --reveal-y: 50%;
    --reveal-size: 115px;
    -webkit-mask-image: radial-gradient(circle var(--reveal-size) at var(--reveal-x) var(--reveal-y), #000 0%, #000 45%, transparent 100%);
    mask-image: radial-gradient(circle var(--reveal-size) at var(--reveal-x) var(--reveal-y), #000 0%, #000 45%, transparent 100%);
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  /* ---------- Portfolio icons ---------- */
  .portfolio-feed { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

  .portfolio-item {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--size);
    color: var(--text);
    text-decoration: none;
    pointer-events: auto;
    touch-action: manipulation;
    will-change: transform;
  }

  .portfolio-item:hover,
  .portfolio-item:focus-visible { z-index: 50; }

  .thumb {
    width: 100%;
    aspect-ratio: 1;
    overflow: hidden;
    background: #fff;
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 22%;
    box-shadow: 0 10px 26px rgba(0,0,0,.16), 0 2px 6px rgba(0,0,0,.08);
    transition: transform .35s var(--ease), box-shadow .35s var(--ease);
  }

  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.92);
    transition: filter .3s ease;
  }

  .portfolio-item:hover .thumb,
  .portfolio-item:focus-visible .thumb {
    transform: scale(1.14);
    box-shadow: 0 22px 44px rgba(0,0,0,.28), 0 4px 10px rgba(0,0,0,.12);
  }

  .portfolio-item:hover .thumb img { filter: saturate(1.1); }

  .label {
    display: block;
    width: max-content;
    margin: 8px auto 0;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.72);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    font-size: clamp(9px, .66vw, 11px);
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: .01em;
    white-space: nowrap;
    text-align: center;
  }

  .category {
    display: none;
    margin-top: 3px;
    text-align: center;
    font-size: 10px;
    line-height: 1;
    color: rgba(0,0,0,.6);
    text-shadow: 0 1px 8px rgba(255,255,255,.9);
  }

  @media (hover: hover) {
    .portfolio-item:hover .category { display: block; }
  }

  .brand, .hint { display: none; }

  /* ---------- Dock (burgundy, macOS-style) ---------- */
  .app-dock {
    position: fixed;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    left: 50%;
    bottom: var(--dock-bottom);
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 7px;
    padding: 10px 14px;
    border-radius: 28px;
    background: rgba(58,12,24,.58);
    -webkit-backdrop-filter: blur(32px) saturate(220%);
    backdrop-filter: blur(32px) saturate(220%);
    border: 1px solid rgba(255,130,160,.25);
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 30px rgba(130,20,50,.3), inset 0 1px 1.5px rgba(255,255,255,.4);
  }

  .app-dock::before {
    content: "";
    position: absolute;
    top: 0; left: 4%; right: 4%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,210,230,.7), transparent);
    pointer-events: none;
  }

  .dock-app {
    position: relative;
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transition: width .12s ease-out, height .12s ease-out, flex-basis .12s ease-out;
  }

  .app-dock.no-anim .dock-app { transition: none; }

  .dock-icon {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 22.5%;
    box-shadow: 0 8px 16px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.45), inset 0 -2px 4px rgba(0,0,0,.35);
  }

  .dock-icon::after {
    content: "";
    position: absolute;
    inset: 0 0 52%;
    background: linear-gradient(180deg, rgba(255,255,255,.28), transparent);
    pointer-events: none;
  }

  .dock-icon svg { width: 62%; height: 62%; }

  .dock-icon.dock-logo-only {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    overflow: visible;
  }

  .dock-icon.dock-logo-only::after { display: none; }
  .dock-icon.dock-logo-only svg { width: 86%; height: 86%; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2)); }

  .dock-tooltip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 12px);
    padding: 5px 11px;
    border-radius: 8px;
    background: rgba(24,10,18,.88);
    border: 1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(5px) scale(.95);
    transition: .15s ease;
  }

  /* .hot = ikon yang sedang disentuh jari; --tt-shift menjaga tooltip tetap di dalam layar */
  .dock-app:focus-visible .dock-tooltip,
  .dock-app.hot .dock-tooltip { opacity: 1; transform: translateX(calc(-50% + var(--tt-shift, 0px))) translateY(0) scale(1); }

  @media (hover: hover) {
    .dock-app:hover .dock-tooltip { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }

  .dock-dot {
    position: absolute;
    left: 50%;
    bottom: -8px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff;
    opacity: 0;
    transform: translateX(-50%);
    transition: opacity .2s ease;
  }

  .dock-separator { width: 1px; height: 40px; margin: 0 3px; border-radius: 999px; background: rgba(255,255,255,.2); }

  @keyframes dockBounce {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-25px) scaleY(1.06); }
    50% { transform: translateY(0) scaleY(.94); }
    75% { transform: translateY(-10px) scaleY(1.03); }
  }

  .dock-app.bouncing { animation: dockBounce .65s cubic-bezier(.28,.84,.42,1); }

  /* ---------- WhatsApp di dock ---------- */
  .dock-wa { text-decoration: none; }

  .dock-wa .dock-icon {
    --wa-base: 0 10px 24px rgba(37,211,102,.5), inset 0 1px 1px rgba(255,255,255,.65), inset 0 -3px 6px rgba(0,80,40,.35);
    border: 1px solid rgba(255,255,255,.4);
    box-shadow: var(--wa-base);
    animation: waPulse 2.8s ease-out infinite;
  }

  .dock-wa .dock-icon svg { width: 60%; height: 60%; filter: drop-shadow(0 1px 2px rgba(0,60,30,.35)); }

  @keyframes waPulse {
    0%   { box-shadow: var(--wa-base), 0 0 0 0 rgba(37,211,102,.55); }
    70%, 100% { box-shadow: var(--wa-base), 0 0 0 16px rgba(37,211,102,0); }
  }

  /* ---------- Dock info modal ---------- */
  .dock-info-backdrop {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: rgba(20,4,10,.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
  }

  .dock-info-backdrop.open { opacity: 1; pointer-events: auto; }

  .dock-info {
    position: fixed;
    left: 50%;
    top: 50%;
    z-index: 120;
    width: min(390px, calc(100vw - 32px));
    padding: 26px;
    border-radius: 20px;
    background: rgba(28,12,20,.9);
    -webkit-backdrop-filter: blur(36px) saturate(210%);
    backdrop-filter: blur(36px) saturate(210%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 40px 90px rgba(0,0,0,.7), 0 0 50px rgba(140,20,60,.35);
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%,-45%) scale(.92);
    transition: opacity .25s ease, transform .3s var(--ease);
  }

  .dock-info.open { opacity: 1; pointer-events: auto; transform: translate(-50%,-50%) scale(1); }

  .dock-info-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }

  .dock-info-icon {
    display: grid;
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
    place-items: center;
    border-radius: 14px;
  }

  .dock-info-icon svg { width: 62%; height: 62%; }
  .dock-info h3 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }

  .dock-info .how-label {
    margin: 0 0 6px;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,180,200,.85);
  }

  .dock-info p { margin: 0; color: rgba(255,255,255,.75); font-size: 13px; line-height: 1.65; }

  .dock-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff;
    cursor: pointer;
    transition: background .2s ease;
  }

  .dock-close:hover { background: rgba(255,255,255,.24); }

  /* ---------- Mobile ---------- */
  @media (max-width: 900px) {
    :root { --dock-bottom: calc(34px + env(safe-area-inset-bottom, 0px)); }

    .portfolio { height: 100svh; min-height: 100svh; }
    .portfolio-image { background-image: url("https://res.cloudinary.com/naqr1mob/image/upload/v1791186943/front_mobile.jpg"); }

    .blur-layer {
      background-image:
        linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)),
        url("https://res.cloudinary.com/naqr1mob/image/upload/v1791186943/back_mobile.jpg");
    }

    .portfolio-item { width: var(--mobile-size); }
    .thumb { border-width: 1.5px; border-radius: 24%; box-shadow: 0 5px 14px rgba(0,0,0,.18); }
    .label { margin-top: 4px; padding: 2px 6px; color: var(--burgundy); font-size: 8px; }

    .app-dock { max-width: calc(100vw - 12px); gap: 3px; padding: 7px 8px; border-radius: 20px; }
    .dock-icon { box-shadow: 0 5px 10px rgba(0,0,0,.4), inset 0 1px 1px rgba(255,255,255,.4); }
    .dock-separator { height: 28px; margin: 0 2px; }
    .dock-tooltip { font-size: 12px; }
    .dock-dot { bottom: -6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dock-app.bouncing, .dock-wa .dock-icon { animation: none; }
  }
</style>
</head>

<body>
  <main class="portfolio" id="portfolio">
    <div class="image-frame">
      <div class="portfolio-image" aria-hidden="true"></div>
      <div class="blur-layer" id="blurLayer" aria-hidden="true"></div>
    </div>

    <div class="brand">Beuna Digital — Portfolio</div>
    <div class="hint">Move cursor to reveal</div>

    <section class="portfolio-feed" id="portfolioFeed" aria-label="Website portfolio"></section>

  </main>

  <div class="dock-info-backdrop" id="dockInfoBackdrop"></div>
  <div class="dock-info" id="dockInfo" role="dialog" aria-modal="true" aria-labelledby="dockInfoTitle" aria-hidden="true">
    <button class="dock-close" id="dockClose" aria-label="Close">×</button>
    <div class="dock-info-head">
      <div class="dock-info-icon" id="dockInfoIcon"></div>
      <h3 id="dockInfoTitle">Application</h3>
    </div>
    <p class="how-label">How I use it</p>
    <p id="dockInfoText"></p>
  </div>

  <nav class="app-dock" id="appDock" aria-label="Tools I use">
    <button class="dock-app" data-name="n8n" data-how="I use n8n to automate repetitive workflows, connect APIs, and move data between the tools behind my websites.">

      <span class="dock-icon dock-logo-only">
        <svg viewBox="0 0 400 400" aria-label="n8n logo">
          <g fill="none" stroke="#ff6b5e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="72" cy="200" r="31" fill="#ff6b5e" stroke="none"/>
            <circle cx="164" cy="200" r="31" fill="#ff6b5e" stroke="none"/>
            <circle cx="328" cy="110" r="31" fill="#ff6b5e" stroke="none"/>
            <circle cx="292" cy="290" r="31" fill="#ff6b5e" stroke="none"/>
            <path d="M103 200h30M195 200h34c31 0 44-90 99-90M195 200h38c31 0 44 90 59 90"/>
          </g>
        </svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="Obsidian" data-how="I use Obsidian as a local knowledge base for notes, ideas, project context, and connected thinking.">
      <span class="dock-tooltip">Obsidian</span>
      <span class="dock-icon" style="background:#09090b;border:1px solid #27272a">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3.5 7v10L12 22l8.5-5V7L12 2z" stroke="#9d7afb" stroke-width="1.8"/><polygon points="12,5 17,9 15,16 12,18 9,16 7,9" fill="#7c3aed"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="Visual Studio Code" data-how="I use VS Code to build and debug the HTML, CSS, and JavaScript that power my web projects.">
      <span class="dock-tooltip">VS Code</span>
      <span class="dock-icon" style="background:#020617;border:1px solid #1e293b">
        <svg viewBox="0 0 24 24"><path d="M17.5 2.5 22 5v14l-4.5 2.5L2 13.5v-3L17.5 2.5Z" fill="#0065A9"/><path d="m17.5 2.5-10 9.5 10 9.5v-19Z" fill="#007ACC"/><path d="M17.5 21.5 22 19V5l-4.5-2.5v19Z" fill="#1F9CF0"/><path d="m2 10.5 5.5 1.5L2 13.5v-3Z" fill="#0065A9"/></svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="Supabase" data-how="I use Supabase for databases, authentication, storage, and lightweight backend services for web projects.">
      <span class="dock-tooltip">Supabase</span>
      <span class="dock-icon" style="background:#171717;border:1px solid #262626">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13.35 2.05a1 1 0 0 0-1.6.15L3.3 14.2a1 1 0 0 0 .8 1.5h6.65l-1.1 6.25a1 1 0 0 0 1.6-.15l8.45-12a1 1 0 0 0-.8-1.55h-6.65l1.1-6.2Z" fill="#3ECF8E"/></svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="Claude" data-how="I use Claude for research, brainstorming, reasoning, content work, and as a second AI perspective when building projects.">
      <span class="dock-tooltip">Claude</span>
      <span class="dock-icon dock-logo-only">
        <svg viewBox="0 0 100 100" aria-label="Claude logo">
          <g fill="none" stroke="#d97757" stroke-width="7" stroke-linecap="round">
            <path d="M50 50L50 8"/><path d="M50 50L71 14"/><path d="M50 50L89 29"/><path d="M50 50L94 50"/>
            <path d="M50 50L89 71"/><path d="M50 50L71 86"/><path d="M50 50L50 94"/><path d="M50 50L29 86"/>

          </g>

      </span><i class="dock-dot"></i>

    <button class="dock-app" data-name="Arc Browser" data-how="I use Arc to research references, test websites, browse client projects, and keep web work separated by context.">

      <span class="dock-icon" style="background:linear-gradient(135deg,#171347,#4c1d95,#0f172a);border:1px solid rgba(162,119,255,.2)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 18C4 10.27 10.27 4 18 4c1.1 0 2 .9 2 2s-.9 2-2 2c-5.52 0-10 4.48-10 10 0 1.1-.9 2-2 2s-2-.9-2-2Z" fill="url(#arcDockGrad)"/><defs><linearGradient id="arcDockGrad" x1="4" y1="4" x2="20" y2="20"><stop stop-color="#FF7AC6"/><stop offset=".5" stop-color="#A277FF"/><stop offset="1" stop-color="#627EEA"/></linearGradient></defs></svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="MainWP" data-how="I use MainWP to manage and monitor multiple WordPress websites from one central dashboard.">
      <span class="dock-tooltip">MainWP</span>
      <span class="dock-icon" style="background:linear-gradient(135deg,#3b82f6,#4f46e5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10Z"/><path d="M8 16v-2M12 16v-4M16 16v-6"/></svg>
      </span><i class="dock-dot"></i>
    </button>

    <button class="dock-app" data-name="Pinterest" data-how="I use Pinterest to collect visual references, design direction, layout ideas, and creative inspiration.">

      <span class="dock-icon" style="background:linear-gradient(135deg,#ef4444,#b91c1c)">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12.02 0C5.4 0 .03 5.37.03 11.99c0 5.08 3.16 9.42 7.62 11.16-.1-.95-.2-2.4.04-3.44.22-.94 1.41-5.96 1.41-5.96s-.36-.72-.36-1.78c0-1.66.97-2.91 2.17-2.91 1.02 0 1.52.77 1.52 1.69 0 1.03-.65 2.57-.99 3.99-.29 1.19.6 2.17 1.78 2.17 2.13 0 3.77-2.25 3.77-5.49 0-2.86-2.06-4.87-5.01-4.87-3.41 0-5.41 2.56-5.41 5.2 0 1.03.39 2.14.89 2.74.1.12.11.23.09.35l-.33 1.36c-.05.23-.17.27-.4.17-1.5-.69-2.43-2.88-2.43-4.65 0-3.78 2.75-7.25 7.92-7.25 4.16 0 7.39 2.97 7.39 6.92 0 4.14-2.61 7.46-6.23 7.46-1.21 0-2.35-.63-2.76-1.38l-.75 2.85c-.27 1.05-1 2.35-1.5 3.15 1.12.35 2.31.54 3.55.54 6.61 0 11.99-5.37 11.99-11.99C23.97 5.37 18.62 0 12.02 0Z"/></svg>
      </span><i class="dock-dot"></i>
    </button>

    <span class="dock-separator" aria-hidden="true"></span>

    <a class="dock-app dock-wa" data-wa="1" href="https://wa.me/62XXXXXXXXXX?text=Halo%20Beuna%20Digital%2C%20saya%20tertarik%20membuat%20website." target="_blank" rel="noopener noreferrer" aria-label="Chat via WhatsApp">

<script>
  const blurLayer = document.getElementById("blurLayer");
  const feed = document.getElementById("portfolioFeed");

  const U = "https://images.unsplash.com/photo-";
  const G = "https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/";
  const moto1 = U + "1537996194471-e657df975ab4?auto=format&fit=crop&w=700&q=80";
  const moto2 = U + "1558005530-fa26e0bcfea5?auto=format&fit=crop&w=700&q=80";

  const projects = [
    {name:"Bike",category:"Rental motor",file:"sewamotor.html",image:moto1},
    {name:"Dami",category:"Rental motor",file:"damirental.html",image:moto1},
    {name:"Amanah",category:"Sewa motor",file:"amanahrental.html",image:moto2},
    {name:"Ray",category:"Rental motor",file:"raytransport.html",image:moto2},
    {name:"Sukabumi",category:"Transport 24 jam",file:"sms.html",image:moto1},
    {name:"CLIO",category:"Auto care",file:"clio.html",image:U+"1503736334956-4c8f8e92946d?auto=format&fit=crop&w=700&q=80"},
    {name:"Dcoating",category:"Coating",file:"dcoating.html",image:"assets-car/car%201.png"},
    {name:"Kaka",category:"Nano ceramic",file:"kaka.html",image:U+"1492144534655-ae79c964c9d7?auto=format&fit=crop&w=700&q=80"},
    {name:"Scuto",category:"Nano ceramic",file:"scuto.html",image:U+"1607860108855-64acf2078ed9?auto=format&fit=crop&w=700&q=80"},
    {name:"Raff",category:"Barber",file:"raffv1.html",image:U+"1503951914875-452162b0f3f1?auto=format&fit=crop&w=700&q=80"},
    {name:"RF",category:"Barbershop",file:"rf.html",image:U+"1622286342621-4bd786c2447c?auto=format&fit=crop&w=700&q=80"},
    {name:"YUJO",category:"Editorial salon",file:"yujo2nd.html",image:U+"1560869713-7d0a29430803?auto=format&fit=crop&w=700&q=80"},
    {name:"YUJO",category:"Salon Petaling Jaya",file:"yujosimple.html",image:U+"1560066984-138dadb4c035?auto=format&fit=crop&w=700&q=80"},
    {name:"Cimaja",category:"Private surf trip",file:"cimajaescape.html",image:G+"cimajaassets/HERO%20PAGE.png"},
    {name:"Lampuuk",category:"Surf academy",file:"surfschool.html",image:G+"adun%20assests/profil%20adun.png"},
    {name:"Sinar",category:"Homestay",file:"sinarnusa.html",image:G+"sinar%20nusa/image_2026-07-23_221850435.png"},
    {name:"Elud",category:"Bakery",file:"elud.html",image:U+"1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=700"},
    {name:"Aneuk",category:"Boxing camp",file:"aneuknanggroe.html",image:G+"assets-random/ChatGPT%20Image%20Jul%2016%2C%202026%2C%2006_32_59%20PM.png"},
    {name:"All-in",category:"Size guide",file:"sizingguide.html",image:G+"sizingguideassets/ChatGPT%20Image%20Sep%203%2C%202026%2C%2004_28_58%20PM.png"},
    {name:"iMessage",category:"Web tool",file:"chatses.html",image:"https://placehold.co/700x700/f0f0f0/111111?text=iMessage"},
    {name:"Simasdev",category:"WebArchitect Pro",file:"simasdev.html",image:G+"logo/icon%20webarchi.jpg"}
  ];

  const portfolio = document.getElementById("portfolio");
  const mobileMQ = matchMedia("(max-width: 900px)");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  // pseudo-random berbenih: acak, tapi hasilnya selalu sama
  function rng(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const items = projects.map((p, i) => {
    const el = document.createElement("a");
    el.className = "portfolio-item";
    el.href = "https://portfolio.beuna.xyz/" + p.file;
    el.target = "_blank";
    el.rel = "noopener noreferrer";
    el.setAttribute("aria-label", p.name + " — " + p.category);
    el.style.setProperty("--size", (58 + ((i * 17) % 45)) + "px");
    el.style.setProperty("--mobile-size", (32 + ((i * 7) % 15)) + "px");
    el.innerHTML =
      '<div class="thumb"><img loading="lazy" src="' + p.image + '" alt="' + esc(p.name) + '"></div>' +
      '<span class="label">' + esc(p.name) + '</span>' +
      '<span class="category">' + esc(p.category) + '</span>';
    feed.appendChild(el);

    const r = rng(i * 977 + 13);
    const it = {
      el, x: 0, y: 0, vx: 0, vy: 0, rot: 0, hw: 0, hover: false,
      heading: r() * Math.PI * 2, spd: r(), tilt: -8 + ((i * 13) % 17),
      p1: r() * 6.28, p2: r() * 6.28, p3: r() * 6.28, f1: .15 + r() * .15, f2: .3 + r() * .2
    };
    el.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") it.hover = true; });
    el.addEventListener("pointerleave", () => { it.hover = false; });
    el.addEventListener("focus", () => { it.hover = true; });
    el.addEventListener("blur", () => { it.hover = false; });
    return it;
  });

  // Area gerak. Mobile: 10% dari atas sampai 55% dari bawah (= 45% dari atas)
  let zone = { l: 0, r: 0, t: 0, b: 0 }, mobile = mobileMQ.matches;

  function measure() {
    const W = portfolio.clientWidth, H = portfolio.clientHeight;
    mobile = mobileMQ.matches;
    zone = mobile
      ? { l: W * .05, r: W * .95, t: H * .10, b: H * .45 }
      : { l: W * .04, r: W * .96, t: H * .07, b: H * .74 };
    items.forEach(it => { it.hw = it.el.offsetWidth / 2; it.hh = it.el.offsetHeight / 2; });
  }

  const clampPos = it => {
    it.x = Math.min(Math.max(it.x, zone.l + it.hw), zone.r - it.hw);
    it.y = Math.min(Math.max(it.y, zone.t + it.hh), zone.b - it.hh);
  };

  const place = it => {
    it.el.style.transform = "translate3d(" + it.x.toFixed(1) + "px," + it.y.toFixed(1) + "px,0) translate(-50%,-50%) rotate(" + it.rot.toFixed(2) + "deg)";
  };

  // Aturan tolak-menolak: bersentuhan TOUCH_FOR detik -> tolak aktif REPEL_FOR detik -> hilang
  const N = items.length, TOUCH_FOR = 2, REPEL_FOR = 2, REACH = 3.5, PUSH = 1.4;
  const touchT = new Float32Array(N * N), activeT = new Float32Array(N * N);

  // Posisi awal: tiap ikon dipilih di titik paling jauh dari yang lain (best-candidate),
  // lalu direlaksasi supaya jaraknya merata -> tidak ada ikon yang berdekatan saat load
  function layout() {
    const r = rng(2026);
    const avg = items.reduce((sum, it) => sum + it.hw, 0) / N;
    const cw = zone.r - zone.l - 2 * avg, ch = zone.b - zone.t - 2 * avg;
    const d0 = .85 * Math.sqrt(Math.max(1, cw * ch) / N);

    items.forEach((it, i) => {
      let best = null, bestScore = -1;
      for (let k = 0; k < 40; k++) {
        const x = zone.l + it.hw + r() * (zone.r - zone.l - 2 * it.hw);
        const y = zone.t + it.hh + r() * (zone.b - zone.t - 2 * it.hh);
        let score = Infinity;
        for (let j = 0; j < i; j++) score = Math.min(score, Math.hypot(x - items[j].x, y - items[j].y));
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
      it.x = best.x;
      it.y = best.y;
    });

    for (let iter = 0; iter < 150; iter++) {
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        const a = items[i], b = items[j];
        let ex = a.x - b.x, ey = a.y - b.y;
        const d = Math.hypot(ex, ey) || .01;
        if (d >= d0) continue;
        const push = (d0 - d) * .25;
        ex /= d; ey /= d;
        a.x += ex * push; a.y += ey * push;
        b.x -= ex * push; b.y -= ey * push;
      }
      items.forEach(clampPos);
    }

    items.forEach(it => { it.rot = it.tilt * .6; place(it); });
    touchT.fill(0);
    activeT.fill(0);
  }

  let last = performance.now();

  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    const base = mobile ? 8 : 16, span = mobile ? 6 : 12, margin = mobile ? 26 : 70;

    // Status tiap pasangan ikon: pasif sampai bersentuhan 2 detik, lalu aktif 2 detik, lalu hilang
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const a = items[i], b = items[j], k = i * N + j;
      if (activeT[k] > 0) {
        activeT[k] += dt;
        if (activeT[k] >= REPEL_FOR) { activeT[k] = 0; touchT[k] = 0; }
      } else if (Math.hypot(a.x - b.x, a.y - b.y) < a.hw + b.hw + 2) {
        touchT[k] += dt;
        if (touchT[k] >= TOUCH_FOR) { activeT[k] = 1e-6; touchT[k] = 0; }
      } else {
        touchT[k] = Math.max(0, touchT[k] - dt * 2);
      }
    }

    for (let ia = 0; ia < N; ia++) {
      const a = items[ia];
      if (a.hover) {                       // berhenti saat disentuh kursor
        a.vx *= .85; a.vy *= .85;
      } else {
        // 1) wander: arah berbelok halus, tiap ikon punya ritme sendiri
        a.heading += (Math.sin(t * a.f1 + a.p1) * .9 + Math.sin(t * a.f2 + a.p2) * .6) * dt;
        const sp = (base + a.spd * span) * (.85 + .15 * Math.sin(t * .5 + a.p3));
        // 2) arus lembut yang sama untuk semua ikon -> gerak terasa kompak
        let dx = Math.cos(a.heading) * sp + Math.cos(t * .11 + a.y / 220) * (mobile ? 2 : 5);
        let dy = Math.sin(a.heading) * sp + Math.sin(t * .09 + a.x / 260) * (mobile ? 1.5 : 3);
        // 3) dorongan halus menjauhi tepi area
        const k = sp * 2.2;
        if (a.x < zone.l + a.hw + margin) dx += (zone.l + a.hw + margin - a.x) / margin * k;
        if (a.x > zone.r - a.hw - margin) dx -= (a.x - (zone.r - a.hw - margin)) / margin * k;
        if (a.y < zone.t + a.hh + margin) dy += (zone.t + a.hh + margin - a.y) / margin * k;
        if (a.y > zone.b - a.hh - margin) dy -= (a.y - (zone.b - a.hh - margin)) / margin * k;
        // 4) tolak-menolak kuat (jangkauan ~3,5 ikon), hanya untuk pasangan yang sedang aktif
        for (let ib = 0; ib < N; ib++) {
          if (ib === ia || !activeT[ia < ib ? ia * N + ib : ib * N + ia]) continue;
          const b = items[ib];
          const ex = a.x - b.x, ey = a.y - b.y, d = Math.hypot(ex, ey) || .01;
          const reach = (a.hw + b.hw) * REACH;
          if (d >= reach) continue;
          const f = (1 - d / reach) * reach * PUSH;
          dx += ex / d * f;
          dy += ey / d * f;
        }
        const ease = Math.min(1, dt * 1.6);
        a.vx += (dx - a.vx) * ease;
        a.vy += (dy - a.vy) * ease;
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        clampPos(a);
        // arah wander ikut arah gerak sebenarnya (tidak "menempel" di tepi)
        let diff = Math.atan2(a.vy, a.vx) - a.heading;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        a.heading += diff * dt * .8;
      }
      const target = a.hover ? 0 : a.tilt * .6 + Math.max(-8, Math.min(8, a.vx * .35)) + Math.sin(t * .5 + a.p3) * 2.5;
      a.rot += (target - a.rot) * Math.min(1, dt * 2);
      place(a);
    }
    requestAnimationFrame(tick);
  }

  measure();
  layout();
  if (!reduceMotion) requestAnimationFrame(tick);

  addEventListener("resize", () => {
    const was = mobile;
    measure();
    if (mobile !== was) layout();
    else items.forEach(it => { clampPos(it); place(it); });
  });

  /* ---------- Cursor reveal ---------- */
  let targetX = innerWidth * .5, targetY = innerHeight * .5;
  let currentX = targetX, currentY = targetY;
  let reveal = 0, lastMove = performance.now();

  let pressing = false, touchMode = false;

  function aim(e) {
    targetX = e.clientX;
    targetY = e.clientY;
    reveal = 1;
    lastMove = performance.now();
  }

  // Mouse: mengikuti kursor. Sentuhan: mengikuti jari selama ditekan, lalu memudar saat dilepas
  addEventListener("pointermove", e => {
    const isMouse = e.pointerType === "mouse";
    if (!isMouse && !pressing) return;
    touchMode = !isMouse;
    aim(e);
  }, { passive: true });

  addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" || e.target.closest(".app-dock, .dock-info")) return;
    pressing = true;
    touchMode = true;
    currentX = e.clientX;               // langsung muncul di bawah jari
    currentY = e.clientY;
    aim(e);
  }, { passive: true });

  const release = e => { if (e.pointerType !== "mouse") pressing = false; };
  addEventListener("pointerup", release);
  addEventListener("pointercancel", release);

  function animateReveal(now) {
    if (pressing) { reveal = 1; lastMove = now; }
    currentX += (targetX - currentX) * .14;
    currentY += (targetY - currentY) * .14;

    const idleFade = Math.max(0, 1 - Math.max(0, now - lastMove - 90) / 4025);
    reveal *= .974;
    const strength = Math.max(reveal, idleFade * .12);
    const speed = Math.abs(targetX - currentX) + Math.abs(targetY - currentY);
    const boost = touchMode ? 1.3 : 1;     // jari menutupi area, jadi lingkaran dibuat lebih besar
    const radius = Math.max(0, Math.min(186 * boost, (98.4 + speed * 2.04) * strength * boost));

    blurLayer.style.setProperty("--reveal-x", currentX + "px");
    blurLayer.style.setProperty("--reveal-y", currentY + "px");
    blurLayer.style.setProperty("--reveal-size", radius + "px");

    requestAnimationFrame(animateReveal);
  }
  requestAnimationFrame(animateReveal);

  /* ---------- Dock ---------- */
  const appDock = document.getElementById("appDock");
  const dockApps = [...document.querySelectorAll(".dock-app")];
  const dockInfo = document.getElementById("dockInfo");
  const dockBackdrop = document.getElementById("dockInfoBackdrop");
  const dockClose = document.getElementById("dockClose");
  const dockInfoTitle = document.getElementById("dockInfoTitle");
  const dockInfoText = document.getElementById("dockInfoText");
  const dockInfoIcon = document.getElementById("dockInfoIcon");

  const BASE = 52, MAX = 92, RANGE = 140;
  let lastFocus = null;

  // Mobile: dock mengecil otomatis agar semua ikon muat; ikon WhatsApp dibuat lebih besar
  const baseSize = app => {
    const wa = !!app.dataset.wa;
    if (mobileMQ.matches) return Math.round(Math.min(36, (innerWidth - 62) / 9.3) * (wa ? 1.3 : 1));
    return wa ? 62 : BASE;
  };

  function sizeDock(fn) {
    dockApps.forEach(app => {
      const s = Math.round(fn(app)) + "px";
      app.style.width = s;
      app.style.height = s;
      app.style.flexBasis = s;
    });
  }

  let restCx = [];   // titik tengah tiap ikon saat dock diam

  // Ukur posisi diam tanpa animasi (dipanggil saat load & resize)
  function measureRest() {
    appDock.classList.add("no-anim");
    sizeDock(baseSize);
    restCx = dockApps.map(a => { const r = a.getBoundingClientRect(); return r.left + r.width / 2; });
    appDock.classList.remove("no-anim");
  }

  // Layar sempit: lebar dock dijaga tetap (efek fisheye) -> ikon di bawah jari membesar,
  // ikon yang jauh mengecil sedikit, dock tidak pernah melebar keluar layar
  function fisheye(x) {
    const bases = dockApps.map(baseSize), W0 = bases.reduce((s, b) => s + b, 0);
    const R = (W0 / dockApps.length) * 2.4, ratio = 1.9;
    const f = dockApps.map((_, i) => {
      const d = Math.abs(x - restCx[i]);
      return d < R ? Math.pow(Math.cos(d / R * Math.PI / 2), 2) : 0;
    });
    const raw = bases.map((b, i) => b * (1 + (ratio - 1) * f[i]));
    const excess = raw.reduce((s, v) => s + v, 0) - W0;
    const w = bases.map((b, i) => (1 - f[i]) * b), sw = w.reduce((s, v) => s + v, 0) || 1;
    sizeDock(app => { const i = dockApps.indexOf(app); return Math.max(raw[i] - excess * w[i] / sw, bases[i] * .55); });
  }

  function updateDock(mouseX) {
    if (mobileMQ.matches) return fisheye(mouseX);
    sizeDock(app => {
      const r = app.getBoundingClientRect();
      const d = Math.abs(mouseX - (r.left + r.width / 2));
      const b = baseSize(app);
      return d < RANGE ? b * (1 + (MAX / BASE - 1) * Math.pow(Math.cos((d / RANGE) * Math.PI / 2), 2)) : b;
    });
  }

  const resetDock = () => sizeDock(baseSize);
  measureRest();
  addEventListener("resize", measureRest);

  appDock.addEventListener("mousemove", e => updateDock(e.clientX));
  appDock.addEventListener("mouseleave", resetDock);
  /* ---------- Sentuhan: geser jari di dock untuk membesarkan ikon, lepas di atas ikon untuk membukanya ---------- */
  let dockTouch = null, hotIdx = -1;

  const nearestIdx = x => {
    let best = 0, bd = Infinity;
    restCx.forEach((c, i) => { const d = Math.abs(x - c); if (d < bd) { bd = d; best = i; } });
    return best;
  };

  function setHot(i) {
    if (i === hotIdx) return;
    if (hotIdx >= 0) dockApps[hotIdx].classList.remove("hot");
    hotIdx = i;
    if (i < 0) return;
    const app = dockApps[i], tt = app.querySelector(".dock-tooltip");
    const half = tt.offsetWidth / 2, c = restCx[i];
    const shift = Math.max(8 - (c - half), 0) - Math.max((c + half) - (innerWidth - 8), 0);
    tt.style.setProperty("--tt-shift", shift + "px");
    app.classList.add("hot");
    if (navigator.vibrate) navigator.vibrate(6);
  }

  function touchAim(e) {
    const r = appDock.getBoundingClientRect();
    const inside = e.clientX > r.left - 24 && e.clientX < r.right + 24 && e.clientY > r.top - 110 && e.clientY < r.bottom + 50;
    if (!inside) { setHot(-1); resetDock(); return; }   // jari keluar dari dock = batal
    updateDock(e.clientX);
    setHot(nearestIdx(e.clientX));
  }

  appDock.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    dockTouch = e.pointerId;
    if (appDock.setPointerCapture) appDock.setPointerCapture(e.pointerId);
    touchAim(e);
  });

  appDock.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse" && e.pointerId === dockTouch) touchAim(e);
  });

  function finishTouch(e, cancel) {
    if (e.pointerId !== dockTouch) return;
    dockTouch = null;
    const idx = hotIdx;
    setHot(-1);
    resetDock();
    if (cancel || idx < 0) return;
    const app = dockApps[idx];
    app.classList.remove("bouncing");
    void app.offsetWidth;
    app.classList.add("bouncing");
    app.click();                       // buka info tool, atau chat WhatsApp
  }

  appDock.addEventListener("pointerup", e => finishTouch(e, false));
  appDock.addEventListener("pointercancel", e => finishTouch(e, true));

  // Aksi sudah ditangani lewat pointerup; cegah klik bawaan agar tidak terpicu dua kali
  appDock.addEventListener("touchend", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });

  dockApps.filter(a => a.tagName === "BUTTON").forEach(app => {
    app.addEventListener("click", () => {
      app.classList.remove("bouncing");
      void app.offsetWidth;
      app.classList.add("bouncing");

      const dot = app.querySelector(".dock-dot");
      if (dot) dot.style.opacity = "1";

      const icon = app.querySelector(".dock-icon");
      dockInfoTitle.textContent = app.dataset.name;
      dockInfoText.textContent = app.dataset.how;
      dockInfoIcon.innerHTML = icon.innerHTML;
      dockInfoIcon.style.cssText = icon.getAttribute("style") || "";

      lastFocus = app;
      dockInfo.classList.add("open");
      dockBackdrop.classList.add("open");
      dockInfo.setAttribute("aria-hidden", "false");
      dockClose.focus();
    });
  });

  function closeDockInfo() {
    dockInfo.classList.remove("open");
    dockBackdrop.classList.remove("open");
    dockInfo.setAttribute("aria-hidden", "true");
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }

  dockClose.addEventListener("click", closeDockInfo);
  dockBackdrop.addEventListener("click", closeDockInfo);
  addEventListener("keydown", e => { if (e.key === "Escape" && dockInfo.classList.contains("open")) closeDockInfo(); });
</script>
</body>
</html>
