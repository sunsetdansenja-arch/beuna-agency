<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beuna Digital — Portfolio</title>
<style>
  :root {
    --bg: #f3f3f3;
    --text: #111;
    --muted: rgba(17,17,17,.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  .portfolio {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    background: #eee;
    isolation: isolate;
  }

  .image-frame {
    position: absolute;
    inset: 14px;
    overflow: hidden;
    border-radius: 28px;
    background: #fff;
  }

  .portfolio-image,
  .blur-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .portfolio-image {
    z-index: 0;
    background: url("https://res.cloudinary.com/naqr1mob/image/upload/v1791184969/front.jpg") center center / cover no-repeat;
  }

  .blur-layer {
    z-index: 1;
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)),
      url("https://res.cloudinary.com/naqr1mob/image/upload/v1791184970/back.jpg") center center / cover no-repeat;
    --reveal-x: 50%;
    --reveal-y: 50%;
    --reveal-size: 115px;
    --reveal-alpha: 0;
    -webkit-mask-image: radial-gradient(
      circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
      #000 0%,
      #000 45%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
      #000 0%,
      #000 45%,
      transparent 100%
    );
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  .portfolio-feed {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .portfolio-item {
    position: absolute;
    width: var(--size);
    left: var(--x);
    top: var(--y);
    pointer-events: auto;
    text-decoration: none;
    color: #111;
    transform: translate(-50%, -50%) rotate(var(--rotation));
    animation:
      drift var(--duration) ease-in-out var(--delay) infinite alternate,
      breathe 5.5s ease-in-out var(--delay) infinite;
    will-change: transform;
  }

  .portfolio-item:hover {
    z-index: 50;
    animation-play-state: paused;
  }

  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(0,0,0,.13);
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,.13);
  }

  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.9);
  }

  .portfolio-item:hover .thumb {
    box-shadow: 0 18px 42px rgba(0,0,0,.23);
  }

  .label {
    display: block;
    margin-top: 6px;
    padding: 0 3px;
    font-size: clamp(8px, .62vw, 10px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: none;
    text-shadow: 0 1px 8px rgba(255,255,255,.85);
    white-space: nowrap;
  }

  .category {
    display: none;
    margin-top: 2px;
    font-size: clamp(7px, .48vw, 9px);
    line-height: 1;
    color: rgba(0,0,0,.52);
    text-shadow: 0 1px 8px rgba(255,255,255,.8);
  }

  .brand {
    display: none;
    position: absolute;
    z-index: 20;
    left: 32px;
    top: 28px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.72);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .hint {
    display: none;
    position: absolute;
    z-index: 20;
    left: 32px;
    bottom: 28px;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(0,0,0,.42);
    pointer-events: none;
  }

  @keyframes drift {
    0% {
      transform: translate(-50%, -50%) translate3d(-12px, 8px, 0) rotate(calc(var(--rotation) - 2deg));
    }
    25% {
      transform: translate(-50%, -50%) translate3d(7px, -10px, 0) rotate(calc(var(--rotation) + 1deg));
    }
    50% {
      transform: translate(-50%, -50%) translate3d(16px, 4px, 0) rotate(calc(var(--rotation) + 3deg));
    }
    75% {
      transform: translate(-50%, -50%) translate3d(-5px, -14px, 0) rotate(calc(var(--rotation) - 1deg));
    }
    100% {
      transform: translate(-50%, -50%) translate3d(-18px, 6px, 0) rotate(calc(var(--rotation) - 3deg));
    }
  }

  @keyframes breathe {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.04); }
  }

  .whatsapp-float {
    position: fixed;
    right: 28px;
    bottom: 24px;
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 13px 9px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.86);
    color: #111;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    box-shadow: 0 10px 28px rgba(0,0,0,.12);
    backdrop-filter: blur(12px);
    animation: whatsapp-float 4.8s ease-in-out infinite;
  }

  .whatsapp-icon {
    display: grid;
    width: 25px;
    height: 25px;
    place-items: center;
    border-radius: 50%;
    background: #25d366;
    color: #fff;
    font-size: 15px;
  }

  @keyframes whatsapp-float {
    0%, 100% { transform: translate3d(0,0,0) rotate(-1deg); }
    50% { transform: translate3d(-5px,-8px,0) rotate(1deg); }
  }

  @media (max-width: 900px) {
    body { overflow: hidden; }

    .portfolio {
      min-height: 100svh;
      height: 100svh;
    }

    .portfolio-image {
      background-image: url("https://res.cloudinary.com/naqr1mob/image/upload/v1791186943/front_mobile.jpg");
      background-position: center center;
      background-size: cover;
    }

    .blur-layer {
      background-image:
        linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)),
        url("https://res.cloudinary.com/naqr1mob/image/upload/v1791186943/back_mobile.jpg");
      background-position: center center;
      background-size: cover;
    }

    .portfolio-feed {
      display: block;
    }

    .portfolio-item {
      display: block;
      width: var(--mobile-size);
      left: var(--mobile-x);
      top: var(--mobile-y);
    }

    .label {
      color: #7b1e2b;
      text-shadow: 0 1px 7px rgba(255,255,255,.95);
    }

    .thumb {
      border-radius: 18px;
      box-shadow: 0 7px 20px rgba(0,0,0,.14);
    }

    .brand {
      left: 20px;
      top: 20px;
    }

    .hint {
      left: 20px;
      bottom: 20px;
    }

    .whatsapp-float {
      right: 16px;
      bottom: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .portfolio-item {
      animation: none;
    }
  }

  /* Burgundy macOS-style dock */
  .app-dock {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 7px;
    padding: 10px 14px;
    border-radius: 28px;
    background: rgba(58,12,24,.58);
    backdrop-filter: blur(32px) saturate(220%);
    -webkit-backdrop-filter: blur(32px) saturate(220%);
    border: 1px solid rgba(255,130,160,.25);
    box-shadow: 0 30px 60px rgba(0,0,0,.5), 0 0 30px rgba(130,20,50,.35), inset 0 1px 1.5px rgba(255,255,255,.4);
  }

  .app-dock::before {
    content: "";
    position: absolute;
    top: 0;
    left: 4%;
    right: 4%;
    height: 1px;
    background: linear-gradient(90deg,transparent,rgba(255,210,230,.7),transparent);
    pointer-events: none;
  }

  .dock-app {
    position: relative;
    flex: 0 0 52px;
    width: 52px;
    height: 52px;
    cursor: pointer;
    transition: width .12s ease-out,height .12s ease-out,transform .12s ease-out;
  }

  .dock-icon {
    width: 100%;
    height: 100%;
    border-radius: 22.5%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 16px rgba(0,0,0,.45), inset 0 1px 1px rgba(255,255,255,.45), inset 0 -2px 4px rgba(0,0,0,.35);
  }

  .dock-icon svg { width: 62%; height: 62%; }

  .dock-icon.dock-logo-only {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    overflow: visible;
  }

  .dock-icon.dock-logo-only svg {
    width: 86%;
    height: 86%;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.18));
  }

  .dock-icon.dock-logo-only::after { display: none; }

  .dock-icon::after {
    content: "";
    position: absolute;
    inset: 0 0 52%;
    background: linear-gradient(180deg,rgba(255,255,255,.28),transparent);
    pointer-events: none;
  }

  .dock-tooltip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform: translateX(-50%) translateY(5px) scale(.95);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    padding: 5px 11px;
    border-radius: 8px;
    color: #fff;
    background: rgba(24,10,18,.86);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(18px);
    font-size: 11px;
    font-weight: 600;
    transition: .15s ease;
  }

  .dock-app:hover .dock-tooltip {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }

  .dock-dot {
    position: absolute;
    left: 50%;
    bottom: -7px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff;
    transform: translateX(-50%);
  }

  .dock-separator {
    width: 1px;
    height: 40px;
    margin: 0 3px;
    border-radius: 999px;
    background: rgba(255,255,255,.2);
  }

  @keyframes dockBounce {
    0%,100% { transform: translateY(0); }
    30% { transform: translateY(-25px) scaleY(1.06); }
    50% { transform: translateY(0) scaleY(.94); }
    75% { transform: translateY(-10px) scaleY(1.03); }
  }

  .dock-app.bouncing { animation: dockBounce .65s cubic-bezier(.28,.84,.42,1); }

  .dock-info {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(390px, calc(100vw - 32px));
    padding: 24px;
    z-index: 120;
    border-radius: 18px;
    transform: translate(-50%,-45%) scale(.9);
    opacity: 0;
    pointer-events: none;
    color: #fff;
    background: rgba(28,12,20,.88);
    backdrop-filter: blur(36px) saturate(210%);
    -webkit-backdrop-filter: blur(36px) saturate(210%);
    border: 1px solid rgba(255,255,255,.2);
    box-shadow: 0 40px 90px rgba(0,0,0,.7),0 0 50px rgba(140,20,60,.35);
    transition: opacity .22s ease,transform .22s cubic-bezier(.16,1,.3,1);
  }

  .dock-info.open {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
    pointer-events: auto;
  }

  .dock-info-backdrop {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: rgba(0,0,0,.12);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }

  .dock-info-backdrop.open { opacity: 1; pointer-events: auto; }

  .dock-info-head {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }

  .dock-info-icon {
    width:48px;
    height:48px;
    border-radius:14px;
    display:grid;
    place-items:center;
    flex:0 0 48px;
  }

  .dock-info-icon svg { width:62%; height:62%; }

  .dock-info h3 { margin:0; font-size:17px; }
  .dock-info .how-label {
    margin: 0 0 6px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(255,180,200,.78);
  }

  .dock-info p {
    margin:0;
    color:rgba(255,255,255,.7);
    font-size:12px;
    line-height:1.6;
  }

  .dock-close {
    position:absolute;
    top:12px;
    right:12px;
    width:24px;
    height:24px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:#fff;
    cursor:pointer;
  }

  @media (max-width:900px) {
    .app-dock {
      bottom: 12px;
      max-width: calc(100vw - 18px);
      gap: 4px;
      padding: 8px 9px;
      border-radius: 22px;
      transform: translateX(-50%) scale(.78);
      transform-origin: bottom center;
    }

    .dock-app { flex-basis: 52px; width:52px; height:52px; }
    .whatsapp-float { bottom: 88px; }
  }

</style>
</head>

<script>
  const portfolio = document.getElementById("portfolio");
  const blurLayer = document.getElementById("blurLayer");
  const feed = document.getElementById("portfolioFeed");

  const projects = [
    {name:"Bike",category:"Rental motor",file:"sewamotor.html",image:"https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=700&q=80"},
    {name:"Dami",category:"Rental motor",file:"damirental.html",image:"https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=700&q=80"},
    {name:"Amanah",category:"Sewa motor",file:"amanahrental.html",image:"https://images.unsplash.com/photo-1558005530-fa26e0bcfea5?auto=format&fit=crop&w=700&q=80"},
    {name:"Ray",category:"Rental motor",file:"raytransport.html",image:"https://images.unsplash.com/photo-1558005530-fa26e0bcfea5?auto=format&fit=crop&w=700&q=80"},
    {name:"Sukabumi",category:"Transport 24 jam",file:"sms.html",image:"https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=700&q=80"},
    {name:"CLIO",category:"Auto care",file:"clio.html",image:"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=700&q=80"},
    {name:"Dcoating",category:"Coating",file:"dcoating.html",image:"assets-car/car%201.png"},
    {name:"Kaka",category:"Nano ceramic",file:"kaka.html",image:"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=700&q=80"},
    {name:"Scuto",category:"Nano ceramic",file:"scuto.html",image:"https://images.unsplash.com/photo-1607860108855-64acf2078ed9?auto=format&fit=crop&w=700&q=80"},
    {name:"Raff",category:"Barber",file:"raffv1.html",image:"https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=700&q=80"},
    {name:"RF",category:"Barbershop",file:"rf.html",image:"https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=700&q=80"},
    {name:"YUJO",category:"Editorial salon",file:"yujo2nd.html",image:"https://images.unsplash.com/photo-1560869713-7d0a29430803?auto=format&fit=crop&w=700&q=80"},
    {name:"YUJO",category:"Salon Petaling Jaya",file:"yujosimple.html",image:"https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=700&q=80"},
    {name:"Cimaja",category:"Private surf trip",file:"cimajaescape.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/cimajaassets/HERO%20PAGE.png"},
    {name:"Lampuuk",category:"Surf academy",file:"surfschool.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/adun%20assests/profil%20adun.png"},
    {name:"Sinar",category:"Homestay",file:"sinarnusa.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/sinar%20nusa/image_2026-07-23_221850435.png"},
    {name:"Elud",category:"Bakery",file:"elud.html",image:"https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=700"},
    {name:"Aneuk",category:"Boxing camp",file:"aneuknanggroe.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/assets-random/ChatGPT%20Image%20Jul%2016%2C%202026%2C%2006_32_59%20PM.png"},
    {name:"All-in",category:"Size guide",file:"sizingguide.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/sizingguideassets/ChatGPT%20Image%20Sep%203%2C%202026%2C%2004_28_58%20PM.png"},
    {name:"iMessage",category:"Web tool",file:"chatses.html",image:"https://placehold.co/700x700/f0f0f0/111111?text=iMessage"},
    {name:"Simasdev",category:"WebArchitect Pro",file:"simasdev.html",image:"https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/logo/icon%20webarchi.jpg"}
  ];

  const positions = [
    [10,17],[23,10],[37,13],[52,9],[67,12],[82,15],
    [7,35],[18,29],[31,31],[46,27],[61,31],[76,29],[91,34],
    [11,54],[25,48],[40,55],[57,50],[72,53],[87,51],
    [20,73],[35,69],[51,76]
  ];

  projects.forEach((project, index) => {
    const el = document.createElement("a");
    const [x, y] = positions[index];

    el.className = "portfolio-item";
    el.href = "https://portfolio.beuna.xyz/" + project.file;
    el.target = "_blank";
    el.rel = "noopener noreferrer";

    const size = 58 + ((index * 17) % 45);
    const rotation = -8 + ((index * 13) % 17);
    const duration = 8 + ((index * 7) % 8);
    const delay = -((index * 1.37) % 8);

    el.style.setProperty("--x", x + "%");
    el.style.setProperty("--y", y + "%");
    el.style.setProperty("--size", size + "px");
    el.style.setProperty("--rotation", rotation + "deg");
    el.style.setProperty("--duration", duration + "s");
    el.style.setProperty("--delay", delay + "s");

    // Mobile: keep all portfolio icons in the upper ~30% of the screen.
    const mobileCols = 7;
    const mobileRow = Math.floor(index / mobileCols);
    const mobileCol = index % mobileCols;
    const mobileX = 7 + mobileCol * 14.3;
    const mobileY = 8 + mobileRow * 9.5;
    const mobileSize = 42 + ((index * 7) % 18);

    el.style.setProperty("--mobile-x", mobileX + "%");
    el.style.setProperty("--mobile-y", mobileY + "%");
    el.style.setProperty("--mobile-size", mobileSize + "px");

    el.innerHTML =
      '<div class="thumb">' +
        '<img loading="lazy" src="' + project.image + '" alt="' + project.name + '">' +
      '</div>' +
      '<span class="label">' + project.name + '</span>' +
      '<span class="category">' + project.category + '</span>';

    feed.appendChild(el);
  });

  let targetX = window.innerWidth * .5;
  let targetY = window.innerHeight * .5;
  let currentX = targetX;
  let currentY = targetY;
  let reveal = 0;
  let lastMove = performance.now();

  window.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;

    targetX = event.clientX;
    targetY = event.clientY;
    reveal = 1;
    lastMove = performance.now();
  }, { passive: true });

  function animateReveal(now) {
    currentX += (targetX - currentX) * 0.14;
    currentY += (targetY - currentY) * 0.14;

    const idleMs = now - lastMove;
    const idleFade = Math.max(0, 1 - Math.max(0, idleMs - 90) / 4025);
    reveal *= 0.974;
    const strength = Math.max(reveal, idleFade * 0.12);

    const speed = Math.abs(targetX - currentX) + Math.abs(targetY - currentY);
    const radius = Math.max(0, Math.min(186, (98.4 + speed * 2.04) * strength));

    blurLayer.style.setProperty("--reveal-x", currentX + "px");
    blurLayer.style.setProperty("--reveal-y", currentY + "px");
    blurLayer.style.setProperty("--reveal-size", radius + "px");

    requestAnimationFrame(animateReveal);
  }

  requestAnimationFrame(animateReveal);


  const appDock = document.getElementById("appDock");
  const dockApps = [...document.querySelectorAll(".dock-app")];
  const dockInfo = document.getElementById("dockInfo");
  const dockBackdrop = document.getElementById("dockInfoBackdrop");
  const dockClose = document.getElementById("dockClose");
  const dockInfoTitle = document.getElementById("dockInfoTitle");
  const dockInfoText = document.getElementById("dockInfoText");
  const dockInfoIcon = document.getElementById("dockInfoIcon");

  const BASE_DOCK_SIZE = 52;
  const MAX_DOCK_SIZE = 92;
  const DOCK_RANGE = 140;

  function updateDock(mouseX) {
    dockApps.forEach(app => {
      const rect = app.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      const distance = Math.abs(mouseX - center);
      const size = distance < DOCK_RANGE
        ? BASE_DOCK_SIZE + (MAX_DOCK_SIZE - BASE_DOCK_SIZE) * Math.pow(Math.cos((distance / DOCK_RANGE) * Math.PI / 2), 2)
        : BASE_DOCK_SIZE;
      app.style.width = size + "px";
      app.style.height = size + "px";
      app.style.flexBasis = size + "px";
    });
  }

  function resetDock() {
    dockApps.forEach(app => {
      app.style.width = BASE_DOCK_SIZE + "px";
      app.style.height = BASE_DOCK_SIZE + "px";
      app.style.flexBasis = BASE_DOCK_SIZE + "px";
    });
  }

  appDock.addEventListener("mousemove", e => updateDock(e.clientX));
  appDock.addEventListener("mouseleave", resetDock);

  dockApps.forEach(app => {
    app.addEventListener("click", () => {
      app.classList.remove("bouncing");
      void app.offsetWidth;
      app.classList.add("bouncing");

      const dot = app.querySelector(".dock-dot");
      if (dot) dot.style.opacity = "1";

      dockInfoTitle.textContent = app.dataset.name;
      dockInfoText.textContent = app.dataset.how;
      dockInfoIcon.innerHTML = app.querySelector(".dock-icon").innerHTML;
      dockInfoIcon.style.cssText = app.querySelector(".dock-icon").getAttribute("style") || "";

      dockInfo.classList.add("open");
      dockBackdrop.classList.add("open");
      dockInfo.setAttribute("aria-hidden","false");
    });
  });

  function closeDockInfo() {
    dockInfo.classList.remove("open");
    dockBackdrop.classList.remove("open");
    dockInfo.setAttribute("aria-hidden","true");
  }

  dockClose.addEventListener("click", closeDockInfo);
  dockBackdrop.addEventListener("click", closeDockInfo);

  window.addEventListener("keydown", e => {
    if (e.key === "Escape") closeDockInfo();
  });

  appDock.addEventListener("touchmove", e => {
    if (e.touches[0]) updateDock(e.touches[0].clientX);
  }, {passive:true});

  appDock.addEventListener("touchend", () => setTimeout(resetDock, 300));

</script>
</body>
</html>
