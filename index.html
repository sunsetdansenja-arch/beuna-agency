<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beuna Digital — Portfolio</title>
<style>
  :root {
    --bg: #f3f3f3;
    --text: #111;
    --muted: rgba(17,17,17,.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
  }

  /* Desktop portfolio canvas */
  .portfolio {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 720px;
    overflow: hidden;
    background: #eee;
    isolation: isolate;
  }

  /*
    EXPOSE IMAGE
    The sharp image lives underneath the blurred image.
    The top blurred layer becomes transparent around the cursor.
  */
  .portfolio-image,
  .portfolio-image::after {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .portfolio-image {
    z-index: 0;
    background: url("https://res.cloudinary.com/naqr1mob/image/upload/v1791182926/expose.jpg") center center / cover no-repeat;
  }

  .blur-layer {
    z-index: 1;
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(255,255,255,.08), rgba(255,255,255,.08)),
      url("https://res.cloudinary.com/naqr1mob/image/upload/v1791182926/blurred.jpg") center center / cover no-repeat;
    /*
      --reveal-x / --reveal-y are updated by JS.
      --reveal is the current reveal strength and fades to 0 while idle.
    */
    --reveal-x: 50%;
    --reveal-y: 50%;
    --reveal-size: 190px;
    --reveal-alpha: 0;
    -webkit-mask-image: radial-gradient(
      circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
      rgba(0,0,0,calc(1 - var(--reveal-alpha))) 0%,
      rgba(0,0,0,calc(1 - var(--reveal-alpha))) 45%,
      transparent 100%
    );
    mask-image: radial-gradient(
      circle var(--reveal-size) at var(--reveal-x) var(--reveal-y),
      rgba(0,0,0,calc(1 - var(--reveal-alpha))) 0%,
      rgba(0,0,0,calc(1 - var(--reveal-alpha))) 45%,
      transparent 100%
    );
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
  }

  /*
    Portfolio items sit above the photograph like the reference:
    no grid, no cards, no sections.
  */
  .portfolio-feed {
    position: absolute;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .portfolio-item {
    position: absolute;
    width: var(--size);
    left: var(--x);
    top: var(--y);
    pointer-events: auto;
    text-decoration: none;
    color: #111;
    transform: translate(-50%, -50%) rotate(var(--rotation));
    animation:
      drift var(--duration) ease-in-out var(--delay) infinite alternate,
      breathe 5.5s ease-in-out var(--delay) infinite;
    will-change: transform;
  }

  .portfolio-item:hover {
    z-index: 50;
    animation-play-state: paused;
  }

  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(0,0,0,.13);
    box-shadow: 0 10px 28px rgba(0,0,0,.13);
  }

  .thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(.9);
  }

  .portfolio-item:hover .thumb {
    box-shadow: 0 18px 42px rgba(0,0,0,.23);
  }

  .label {
    display: block;
    margin-top: 5px;
    padding-left: 1px;
    font-size: clamp(8px, .62vw, 11px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(255,255,255,.85);
  }

  .category {
    display: block;
    margin-top: 2px;
    font-size: clamp(7px, .48vw, 9px);
    line-height: 1;
    color: rgba(0,0,0,.52);
    text-shadow: 0 1px 8px rgba(255,255,255,.8);
  }

  .brand {
    position: absolute;
    z-index: 20;
    left: 32px;
    top: 28px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: rgba(0,0,0,.72);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .hint {
    position: absolute;
    z-index: 20;
    left: 32px;
    bottom: 28px;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(0,0,0,.42);
    pointer-events: none;
  }

  @keyframes drift {
    0% {
      transform: translate(-50%, -50%) translate3d(-12px, 8px, 0) rotate(calc(var(--rotation) - 2deg));
    }
    25% {
      transform: translate(-50%, -50%) translate3d(7px, -10px, 0) rotate(calc(var(--rotation) + 1deg));
    }
    50% {
      transform: translate(-50%, -50%) translate3d(16px, 4px, 0) rotate(calc(var(--rotation) + 3deg));
    }
    75% {
      transform: translate(-50%, -50%) translate3d(-5px, -14px, 0) rotate(calc(var(--rotation) - 1deg));
    }
    100% {
      transform: translate(-50%, -50%) translate3d(-18px, 6px, 0) rotate(calc(var(--rotation) - 3deg));
    }
  }

  @keyframes breathe {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.04); }
  }

  /*
    Desktop is the current scope.
    Keep the mobile layout intentionally simple until the mobile pass.
  */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .portfolio {
      min-height: 100svh;
      height: 100svh;
    }

    .portfolio-item {
      display: none;
    }

    .brand {
      left: 20px;
      top: 20px;
    }

    .hint {
      left: 20px;
      bottom: 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .portfolio-item {
      animation: none;
    }
  }
</style>
</head>

<body>
  <main class="portfolio" id="portfolio">
    <div class="portfolio-image" aria-hidden="true"></div>
    <div class="blur-layer" id="blurLayer" aria-hidden="true"></div>

    <div class="brand">Beuna Digital — Portfolio</div>
    <div class="hint">Move cursor to reveal</div>

    <section class="portfolio-feed" id="portfolioFeed" aria-label="Website portfolio"></section>
  </main>

<script>
  const portfolio = document.getElementById("portfolio");
  const blurLayer = document.getElementById("blurLayer");
  const feed = document.getElementById("portfolioFeed");

  /*

    The actual portfolio pages are not copied into this repo in this pass.

  const projects = [

    {

    },

    },
    {

    },

    },
    {

      category: "Auto care",

      image: "assets-car/car%201.png"
    },
    {
      name: "Dcoating Sealant",
      category: "Coating",
      file: "dcoating.html",
      image: "assets-car/car%201.png"
    },
    {
      name: "Kaka Autocare",
      category: "Nano ceramic",
      file: "kaka.html",
      image: "assets-car/car%202.png"
    },
    {
      name: "Scuto Aceh",
      category: "Nano ceramic",
      file: "scuto.html",
      image: "assets-car/ceramic.png"
    },
    {
      name: "Raff Trims",
      category: "Barber",
      file: "raffv1.html",
      image: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=700&q=80"
    },
    {
      name: "RF Barbershop",
      category: "Barbershop",
      file: "rf.html",
      image: "https://images.unsplash.com/photo-1622286342621-4bd786c2447c?auto=format&fit=crop&w=700&q=80"
    },
    {
      name: "YUJO Hair Studio",
      category: "Editorial salon",
      file: "yujo2nd.html",
      image: "https://images.unsplash.com/photo-1560869713-7d0a29430803?auto=format&fit=crop&w=700&q=80"
    },
    {
      name: "YUJO Hair Studio",
      category: "Salon Petaling Jaya",
      file: "yujosimple.html",
      image: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=700&q=80"
    },
    {
      name: "Cimaja Escape",
      category: "Private surf trip",
      file: "cimajaescape.html",
      image: "https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/cimajaassets/HERO%20PAGE.png"
    },
    {

      file: "surfschool.html",

    {

    },
    {
      name: "Elud Cake & Bakery",
      category: "Bakery",
      file: "elud.html",
      image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&q=80&w=700"
    },
    {
      name: "Aneuk Nanggroe",
      category: "Boxing camp",
      file: "aneuknanggroe.html",
      image: "https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/assets-random/ChatGPT%20Image%20Jul%2016%2C%202026%2C%2006_32_59%20PM.png"
    },
    {
      name: "All-in Merchmaker",
      category: "Size guide",
      file: "sizingguide.html",
      image: "https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/sizingguideassets/ChatGPT%20Image%20Sep%203%2C%202026%2C%2004_28_58%20PM.png"
    },
    {
      name: "iMessage Generator",
      category: "Web tool",
      file: "chatses.html",
      image: "https://placehold.co/700x700/f0f0f0/111111?text=iMessage"
    },
    {
      name: "simasdev",
      category: "WebArchitect Pro",
      file: "simasdev.html",
      image: "https://raw.githubusercontent.com/sunsetdansenja-arch/2NDDUMMY/main/logo/icon%20webarchi.jpg"
    }
  ];

  /*
    Fixed seed keeps the composition stable between refreshes.
    Items are deliberately spread across the canvas with a clear central
    negative-space zone so the reference portrait remains readable.
  */
  const positions = [
    [10,17],[23,10],[37,13],[52,9],[67,12],[82,15],
    [7,35],[18,29],[31,31],[46,27],[61,31],[76,29],[91,34],
    [11,54],[25,48],[40,55],[57,50],[72,53],[87,51],
    [20,73],[35,69],[51,76]
  ];

  projects.forEach((project, index) => {
    const el = document.createElement("a");
    const [x, y] = positions[index];

    el.className = "portfolio-item";
    el.href = "https://github.com/sunsetdansenja-arch/2NDDUMMY/blob/main/" + project.file;
    el.target = "_blank";
    el.rel = "noopener noreferrer";

    const size = 68 + ((index * 17) % 57);
    const rotation = -8 + ((index * 13) % 17);
    const duration = 8 + ((index * 7) % 8);
    const delay = -((index * 1.37) % 8);

    el.style.setProperty("--x", x + "%");
    el.style.setProperty("--y", y + "%");
    el.style.setProperty("--size", size + "px");
    el.style.setProperty("--rotation", rotation + "deg");
    el.style.setProperty("--duration", duration + "s");
    el.style.setProperty("--delay", delay + "s");

    el.innerHTML =
      '<div class="thumb">' +
        '<img loading="lazy" src="' + project.image + '" alt="' + project.name + '">' +
      '</div>' +
      '<span class="label">' + project.name + '</span>' +
      '<span class="category">' + project.category + '</span>';

    feed.appendChild(el);
  });

  /*
    Cursor reveal:
    - movement immediately increases the reveal
    - the reveal radius follows the cursor
    - when the cursor stops, strength decays smoothly
  */
  let targetX = window.innerWidth * .5;
  let targetY = window.innerHeight * .5;
  let currentX = targetX;
  let currentY = targetY;
  let reveal = 0;
  let lastMove = performance.now();

  window.addEventListener("pointermove", (event) => {
    if (event.pointerType !== "mouse") return;

    targetX = event.clientX;
    targetY = event.clientY;
    reveal = 1;
    lastMove = performance.now();
  }, { passive: true });

  function animateReveal(now) {
    currentX += (targetX - currentX) * 0.14;
    currentY += (targetY - currentY) * 0.14;

    const idleMs = now - lastMove;
    const idleFade = Math.max(0, 1 - Math.max(0, idleMs - 90) / 1150);
    reveal *= 0.90;
    const strength = Math.max(reveal, idleFade * 0.12);

    const speed = Math.abs(targetX - currentX) + Math.abs(targetY - currentY);
    const radius = Math.min(285, 150 + speed * 3.2);

    blurLayer.style.setProperty("--reveal-x", currentX + "px");
    blurLayer.style.setProperty("--reveal-y", currentY + "px");
    blurLayer.style.setProperty("--reveal-size", radius + "px");
    blurLayer.style.setProperty("--reveal-alpha", Math.min(0.98, strength).toFixed(3));

    requestAnimationFrame(animateReveal);
  }

  requestAnimationFrame(animateReveal);
</script>
</body>
</html>
